<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Squares</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Latin Squares</h1>
        
        <div class="controls top-controls">
            <!-- Custom Styled Dropdown -->
            <div class="custom-select" id="difficulty-select">
                <div class="select-selected">Easy <span class="select-arrow"></span></div>
                <div class="select-items select-hide">
                    <div data-value="easy" class="same-as-selected">Easy</div>
                    <div data-value="medium">Medium</div>
                    <div data-value="hard">Hard</div>
                    <div data-value="random">Random (Any Difficulty)</div>
                </div>
            </div>
        </div>

        <div class="status" id="status-message">Select an answer below</div>

        <div class="grid" id="puzzle-grid">
            <!-- JS generates grid cells here -->
        </div>

        <div class="mcq-section" id="mcq-options">
            <!-- JS generates 5 buttons here -->
        </div>

        <div class="controls bottom-controls">
            <button id="new-game-btn">Generate New Puzzle</button>
            <button id="show-solution-btn">Show Solution</button>
        </div>

        <div class="footer">
            <a href="https://github.com/ArjunKawale/LatinSquares" target="_blank" rel="noopener noreferrer">
                <svg height="24" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="24" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                GitHub
            </a>
        </div>
    </div>
    <script src="logic.js"></script>
</body>
</html>
