<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Squares</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Latin Squares</h1>
        
        <div class="controls top-controls">
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="random">Random (Any Difficulty)</option>
            </select>
        </div>

        <div class="status" id="status-message">Select an answer below</div>

        <div class="grid" id="puzzle-grid">
            <!-- JS generates grid cells here -->
        </div>

        <div class="mcq-section" id="mcq-options">
            <!-- JS generates 5 buttons here -->
        </div>

        <div class="controls bottom-controls">
            <button id="new-game-btn">Generate New Puzzle</button>
            <button id="show-solution-btn">Show Solution</button>
        </div>
    </div>
    <script src="logic.js"></script>
</body>
</html>
